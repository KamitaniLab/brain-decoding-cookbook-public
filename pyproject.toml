[project]
name = "brain-decoding-cookbook"
version = "0.1.0"
description = "A cookbook for brain decoding and reconstruction"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.23,<2.0",
    "scipy>=1.9,<2.0",
    "scikit-learn>=1.2,<1.6",
    "pandas>=1.5,<2.0",
    "pillow>=9,<12",
    "hdf5storage>=0.2,<0.3",
    "pyyaml>=6,<7",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3,<3.0",
    "torch>=2.1,<3.0",
    "torchmetrics>=1.2,<2.0",
    "tqdm>=4.64,<5.0",
    "bdpy>=0.24,<0.27",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.12,<1.0",
    "ipykernel",
    "pip",
    "jupyterlab",
    "nibabel",
    "nilearn",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]