# Feature-to-generator (FG) reconstruction configuration.

defaults:
  - paths: default
  - generator: relu6generator

features:
  name: ImageNetTest_bvlc_reference_caffenet
  path: ${paths.features_caffenet}

output:
  path: ./data/reconstruction/fg/${_analysis_name_}_${generator.name}/true
  prefix: recon_image-
  ext: tiff

evaluation:
  true_image:
    path: ${paths.true_images}
    ext: JPEG
