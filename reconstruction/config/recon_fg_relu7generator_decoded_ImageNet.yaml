# Feature-to-generator (FG) reconstruction configuration.

defaults:
  - generator: relu7generator

decoded_features:
  name: ImageNetTest_deeprecon_reference_caffenet
  path: ./data/decoded_features/ImageNetTest/deeprecon_originals/bvlc_reference_caffenet
  subjects:
    - sub-01
  rois:
    - VC
  decoders:
    path: ./data/feature_decoders/ImageNetTraining/deeprecon_originals/bvlc_reference_caffenet

fg:
  feature_scaling: feature_std_train_mean_center

output:
  path: ./data/reconstruction/fg/${_analysis_name_}_${generator.name}_scaling_${fg.feature_scaling}/decoded
  prefix: recon_image-
  ext: tiff

evaluation:
  true_image:
    path: ./data/images/ImageNetTest/source
    ext: JPEG
